<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaus Lab — teste hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wght@300..600&display=swap">
<style>
:root{--musgo-0:#151A10;--musgo-1:#1E2517;--linha:#9AA374;--cobre:#C8834F;--papel:#F2EFE8;--muted:#A9A89A;
  --display:"Archivo","Arial Black",sans-serif;--mono:"Martian Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{background:var(--musgo-1);color:var(--papel);font:400 13px/1.6 var(--mono)}
.d{font-family:var(--display);font-weight:850;font-stretch:118%;text-transform:uppercase;letter-spacing:-.045em}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{position:relative;height:100vh;min-height:640px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
.grid{position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(var(--linha) 1px,transparent 1px),linear-gradient(90deg,var(--linha) 1px,transparent 1px);
  background-size:24px 24px}
svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ui{position:absolute;inset:0;padding:28px clamp(16px,4vw,56px);display:grid;grid-template-rows:auto 1fr auto;pointer-events:none}
.ui a,.ui .tag{pointer-events:auto}
header{display:flex;justify-content:space-between;border-bottom:1px solid rgba(154,163,116,.25);padding-bottom:14px}
.copy{align-self:end;max-width:640px;padding-bottom:6vh}
h1{font-size:clamp(40px,6.4vw,112px);line-height:.86;margin:16px 0 22px}
h1 em{font-style:normal;color:var(--cobre)}
.lead{max-width:44ch;color:#D9D6CC}
.tag{position:absolute;display:flex;flex-direction:column;gap:2px;padding:12px 16px;min-width:170px;color:var(--papel);text-decoration:none;
  background:rgba(242,239,232,.06);border:1px solid rgba(242,239,232,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .3s,color .3s}
.tag b{font:850 28px/1 var(--display);font-stretch:118%;letter-spacing:-.04em}
.tag:hover{background:var(--cobre);color:var(--musgo-0)}
.tag:hover .lbl{color:var(--musgo-0)}
.tag.core{background:none;border:0;backdrop-filter:none;min-width:0;padding:0}
@media (max-width:820px){.copy{padding-bottom:2vh}.tag{min-width:130px;padding:10px 12px}.tag b{font-size:22px}}
</style>
</head>
<body>
<section class="hero">
  <canvas id="c"></canvas>
  <div class="grid"></div>
  <svg class="ov" id="ov"></svg>
  <div class="ui">
    <header><span class="lbl" style="color:var(--papel)">Ks · Kaus Lab</span><span class="lbl">Prancha 01</span><a class="lbl" style="color:var(--papel);text-decoration:none" href="#contato">Contato ↗</a></header>
    <div></div>
    <div class="copy">
      <span class="lbl">00 — Quem escreve</span>
      <h1 class="d">Sara<br>Ribi<em>kaus</em>kas</h1>
      <p class="lead">[A DEFINIR] A Kaus Lab é o meu laboratório: o lugar onde os projetos que eu crio se encontram.</p>
    </div>
  </div>
  <a class="tag" id="t-pf" href="#portfolio"><span class="lbl">01 · Projeto</span><b>Pf</b><span>Portfólio ↗</span></a>
  <a class="tag" id="t-mu" href="#musica"><span class="lbl">02 · Projeto</span><b>Mu</b><span>Música ↗</span></a>
  <div class="tag core" id="t-ks"><span class="lbl">Núcleo · Ks</span></div>
</section>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const canvas=document.getElementById('c');
const r=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(Math.min(devicePixelRatio,2));
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;
const scene=new THREE.Scene();scene.background=new THREE.Color('#1E2517');
scene.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;
const cam=new THREE.PerspectiveCamera(30,1,.1,100);cam.position.set(0,0,11);

// fundo com luz difusa para o vidro refratar
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,'rgba(200,131,79,.55)');gr.addColorStop(.45,'rgba(91,106,60,.35)');gr.addColorStop(1,'rgba(30,37,23,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)})();
const glow=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.MeshBasicMaterial({map:glowTex,transparent:true,depthWrite:false}));
glow.position.z=-5;scene.add(glow);
const ringMat=new THREE.MeshBasicMaterial({color:'#9AA374',transparent:true,opacity:.35});
for(const [rad,y] of [[2.6,0],[3.6,0]]){const m=new THREE.Mesh(new THREE.TorusGeometry(rad,.006,8,160),ringMat);m.position.z=-3;scene.add(m)}

const glass=(rough=.04)=>new THREE.MeshPhysicalMaterial({color:'#ffffff',transmission:1,roughness:rough,thickness:.9,ior:1.5,
  attenuationColor:new THREE.Color('#DDE6C6'),attenuationDistance:9,clearcoat:1,clearcoatRoughness:.05,specularIntensity:1});
const copper=new THREE.MeshPhysicalMaterial({color:'#C8834F',metalness:1,roughness:.22,clearcoat:.6});

const group=new THREE.Group();scene.add(group);
const nodes={
  ks:{p:[0,0,0],s:.95,m:copper},
  pf:{p:[-1.9,1.25,.4],s:.85,m:glass()},
  mu:{p:[1.8,-1.35,.3],s:.85,m:glass()},
  a:{p:[1.55,1.6,-.6],s:.5,m:glass(.35)},
  b:{p:[-1.5,-1.55,-.4],s:.45,m:glass(.35)},
  c:{p:[2.9,.35,-1],s:.32,m:glass()},
  d:{p:[-2.9,-.1,-.8],s:.28,m:glass(.35)}};
const sph=new THREE.SphereGeometry(1,96,96);
for(const k in nodes){const n=nodes[k];const m=new THREE.Mesh(sph,n.m);m.position.set(...n.p);m.scale.setScalar(n.s);group.add(m);n.mesh=m}
const bondMat=glass(.08);
const bond=(a,b)=>{const A=new THREE.Vector3(...nodes[a].p),B=new THREE.Vector3(...nodes[b].p);
  const len=A.distanceTo(B);const g=new THREE.CylinderGeometry(.07,.07,len,32);const m=new THREE.Mesh(g,bondMat);
  m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),B.clone().sub(A).normalize());group.add(m)};
[['ks','pf'],['ks','mu'],['ks','a'],['ks','b'],['mu','c'],['pf','d']].forEach(([a,b])=>bond(a,b));

const key=new THREE.DirectionalLight('#fff4e6',2.2);key.position.set(4,5,6);scene.add(key);

// callouts técnicos ligados às esferas
const ov=document.getElementById('ov'),NS='http://www.w3.org/2000/svg';
const tags=[['pf','t-pf',-1],['mu','t-mu',1],['ks','t-ks',1]].map(([n,id,side])=>{
  const line=document.createElementNS(NS,'polyline');line.setAttribute('fill','none');line.setAttribute('stroke',n==='ks'?'#C8834F':'#9AA374');
  line.setAttribute('stroke-width','1');if(n!=='ks')line.setAttribute('stroke-dasharray','3 4');ov.appendChild(line);
  const dot=document.createElementNS(NS,'circle');dot.setAttribute('r','3.5');dot.setAttribute('fill',n==='ks'?'#C8834F':'#F2EFE8');ov.appendChild(dot);
  return {n,el:document.getElementById(id),side,line,dot}});

let W,H,mx=0,my=0;
function size(){W=innerWidth;H=canvas.parentElement.clientHeight;r.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();
  const mob=W<820;group.position.set(mob?0:1.9,mob?1.4:.35,0);group.scale.setScalar(mob?.55:.72)}
addEventListener('resize',size);size();
addEventListener('pointermove',e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5});

const v=new THREE.Vector3(),t0=performance.now();
function frame(){
  const t=(performance.now()-t0)/1000;
  group.rotation.y=Math.sin(t*.18)*.35+mx*.4;group.rotation.x=Math.sin(t*.13)*.12+my*.25;
  glow.position.x=group.position.x;glow.position.y=group.position.y;
  r.render(scene,cam);
  for(const tg of tags){
    nodes[tg.n].mesh.getWorldPosition(v);const rad=nodes[tg.n].s*group.scale.x;v.project(cam);
    const x=(v.x+1)/2*W,y=(1-v.y)/2*H;
    const ex=x+tg.side*(W<820?90:170),ey=y-(W<820?50:70);
    const bw=tg.el.offsetWidth,bh=tg.el.offsetHeight;
    let lx=Math.min(Math.max(16,tg.side<0?ex-bw:ex),W-bw-16);const ex2=tg.side<0?lx+bw:lx;tg.el.style.left=lx+'px';tg.el.style.top=(ey-bh/2)+'px';
    const sx=x+tg.side*14,sy=y-14;
    tg.line.setAttribute('points',`${sx},${sy} ${ex2-tg.side*30},${ey} ${ex2},${ey}`);
    tg.dot.setAttribute('cx',sx);tg.dot.setAttribute('cy',sy);
  }
  requestAnimationFrame(frame)}
frame();
</script>
</body>
</html>
